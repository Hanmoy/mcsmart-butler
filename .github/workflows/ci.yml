name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} tests
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: "true"
      MCSMART_HOME: ${{ runner.temp }}/mcsmart-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Node tests
        run: npm test

  browser:
    name: Browser regression
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      MCSMART_HOME: ${{ runner.temp }}/mcsmart-home-browser
      MCSMART_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser tests
        run: npm run test:browser

  package:
    name: Package smoke test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      MCSMART_HOME: ${{ runner.temp }}/mcsmart-home-package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Build Skill package
        run: npm run package -- --zip
      - name: Verify package license and version
        env:
          MCSMART_PACKAGE_DIR: dist-package/mcsmart-butler
        run: node scripts/test-release-readiness.mjs
